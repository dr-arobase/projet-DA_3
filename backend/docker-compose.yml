services:
  postgres:
    image: postgres:16
    container_name: crimetracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: crimetracker
      POSTGRES_USER: crimetracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crimetracker}
    ports:
      - "5432:5432"
    volumes:
      - crimetracker-db-data:/var/lib/postgresql/data
      - ./serveur/database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./serveur/database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: crimetracker-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./serveur/src:/app/serveur/src

volumes:
  crimetracker-db-data: