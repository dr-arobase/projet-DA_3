# CrimeTracker sur une machine où il n'y a que Docker : pas de code source, pas
# de build. Les images viennent du registre (publiées par la CI à chaque push
# sur main) ; les valeurs propres à la machine viennent d'un fichier .env posé
# à côté (voir .env.example).
#
#     cd deploy && docker compose up -d        puis ouvrir http://<machine>:8080

name: crimetracker-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: crimetracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: crimetracker
    # Pas de ports : seule l'API, sur le réseau privé, parle à la base.
    volumes:
      - crimetracker-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crimetracker"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    image: ghcr.io/${OWNER:?OWNER manquant dans .env}/crimetracker-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://crimetracker:${POSTGRES_PASSWORD}@postgres:5432/crimetracker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      SOCKET_ALLOWED_ORIGINS: ${SOCKET_ALLOWED_ORIGINS:?SOCKET_ALLOWED_ORIGINS manquant dans .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Relais TURN des appels (service turn ci-dessous) : vide = STUN seulement
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      # Les photos de profil survivent aux mises à jour de l'image
      - crimetracker-uploads:/app/serveur/src/uploads
    depends_on:
      postgres:
        condition: service_healthy

  client:
    image: ghcr.io/${OWNER}/crimetracker-client:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  # Relais TURN (coturn) pour les appels : quand deux appareils ne peuvent pas se joindre
  # directement (données mobiles, pare-feu), le son et l'image passent par ici.
  # Démarré seulement avec COMPOSE_PROFILES=turn dans .env (voir .env.example).
  # network_mode host : coturn doit voir la vraie adresse de la machine et ouvrir ses ports de relais.
  # Ports à ouvrir dans le pare-feu (Azure : groupe de sécurité réseau) :
  #   3478 TCP et UDP, puis 49160-49200 UDP.
  turn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    profiles: ["turn"]
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-}
      - --realm=${TURN_REALM:-crimetracker}
      # Adresse publique/adresse privée de la machine (Azure : la VM ne voit que l'adresse privée)
      - --external-ip=${TURN_EXTERNAL_IP:-}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Le relais ne doit pas servir à atteindre le réseau interne de la machine
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

volumes:
  crimetracker-pgdata:
  crimetracker-uploads:
