# CrimeTracker sur une machine où il n'y a que Docker : pas de code source, pas
# de build. Les images viennent du registre (publiées par la CI à chaque push
# sur main) ; les valeurs propres à la machine viennent d'un fichier .env posé
# à côté (voir .env.example).
#
#     cd deploy && docker compose up -d        puis ouvrir http://<machine>:8080

name: crimetracker-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: crimetracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: crimetracker
    # Pas de ports : seule l'API, sur le réseau privé, parle à la base.
    volumes:
      - crimetracker-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crimetracker"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    image: ghcr.io/${OWNER:?OWNER manquant dans .env}/crimetracker-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://crimetracker:${POSTGRES_PASSWORD}@postgres:5432/crimetracker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy

  client:
    image: ghcr.io/${OWNER}/crimetracker-client:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  crimetracker-pgdata:
