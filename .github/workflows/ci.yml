# Intégration continue : mêmes vérifications que le hook .githooks/pre-push
# (tests du backend, démarrage réel du serveur, build du frontend).
# Si une étape échoue, le commit est marqué en rouge sur GitHub.
name: Intégration Continue

on:
  push:
    branches: [main, develop/test]
  pull_request:
    branches: [main, develop/test]
  workflow_dispatch:

jobs:
  verification:
    name: Tests, démarrage du serveur et build du frontend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crimetracker
          POSTGRES_PASSWORD: crimetracker
          POSTGRES_DB: crimetracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crimetracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://crimetracker:crimetracker@localhost:5432/crimetracker
      JWT_SECRET: secret-de-la-ci

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Installer les dépendances du backend
        run: npm ci
        working-directory: backend

      - name: Installer les dépendances du frontend
        run: npm ci
        working-directory: frontend

      - name: Vérifier le projet
        run: node scripts/verifier-avant-push.mjs

  build_and_publish:
    name: Construire et publier les images Docker (main seulement)
    needs: verification
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Se connecter au registre GitHub (ghcr.io)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Construire et publier crimetracker-api et crimetracker-client
        run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          SHA=sha-${GITHUB_SHA::7}
          for APP in api:backend client:frontend; do
            IMAGE=ghcr.io/$OWNER/crimetracker-${APP%%:*}
            docker build -t $IMAGE:latest -t $IMAGE:$SHA ./${APP##*:}
            docker push $IMAGE:latest
            docker push $IMAGE:$SHA
          done

  compose:
    name: Démarrage complet avec docker compose
    needs: verification
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Construire et démarrer les trois services
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Vérifier le frontend, l'API et Swagger à travers nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api-docs/ | grep -q swagger-ui
          curl -fsS -X POST http://localhost:8080/api/auth/login             -H 'Content-Type: application/json'             -d '{"badge_number":"inconnu","password":"x"}' -o /dev/null -w '%{http_code}' | grep -q 401

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêter
        if: always()
        run: docker compose down -v
