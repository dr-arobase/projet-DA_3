# Intégration continue : mêmes vérifications que le hook .githooks/pre-push
# (tests du backend, démarrage réel du serveur, build du frontend).
# Si une étape échoue, le commit est marqué en rouge sur GitHub.
name: Intégration Continue

on:
  push:
    branches: [main, develop/test]
  pull_request:
    branches: [main, develop/test]
  workflow_dispatch:

jobs:
  verification:
    name: Tests, démarrage du serveur et build du frontend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crimetracker
          POSTGRES_PASSWORD: crimetracker
          POSTGRES_DB: crimetracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crimetracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://crimetracker:crimetracker@localhost:5432/crimetracker
      JWT_SECRET: secret-de-la-ci

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Installer les dépendances du backend
        run: npm ci
        working-directory: backend

      - name: Installer les dépendances du frontend
        run: npm ci
        working-directory: frontend

      - name: Vérifier le projet
        run: node scripts/verifier-avant-push.mjs

  build_and_publish:
    name: Build Docker image and publish (main only)
    needs: verification
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push Docker image
        run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          SHA=sha-${GITHUB_SHA::7}
          IMAGE=ghcr.io/$OWNER/crimetracker-api

          docker build -t $IMAGE:latest -t $IMAGE:$SHA ./backend
          docker push $IMAGE:latest
          docker push $IMAGE:$SHA
