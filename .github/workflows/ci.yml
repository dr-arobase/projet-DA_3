# Flux d'intégration continue pour le projet avec matrix Node
name: Intégration Continue

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Install & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crimetracker
          POSTGRES_PASSWORD: crimetracker
          POSTGRES_DB: crimetracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crimetracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set DATABASE_URL for tests
        run: ${GITHUB_ENV}

      - name: Run tests if present
        run: |
          if npm run | grep -q "test"; then
            npm test
          else
            echo "No test script defined; skipping tests."
          fi

  build_and_publish:
    name: Build Docker image and publish (main only)
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push Docker image
        run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          SHA=sha-${GITHUB_SHA::7}
          IMAGE=ghcr.io/$OWNER/crimetracker-api

          docker build -t $IMAGE:latest -t $IMAGE:$SHA .
          docker push $IMAGE:latest
          docker push $IMAGE:$SHA

# Notes:
# - Ce workflow installe les dépendances et exécute les tests si un script "test" est présent.
# - Le job de build publie une image sur ghcr.io uniquement pour la branche `main`.